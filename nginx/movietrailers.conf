# ===========================================
# Nginx Configuration for Movie Trailers App
# ===========================================
# Copy to: /etc/nginx/sites-available/movietrailers
# Then run: sudo ln -s /etc/nginx/sites-available/movietrailers /etc/nginx/sites-enabled/
# ===========================================

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=dead_city_billing:10m rate=6r/m;

# Trust the client address only when Cloudflare connected to this origin.
# Source: https://www.cloudflare.com/ips/ (checked 2026-07-27).
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Docker DNS resolver
resolver 127.0.0.11 valid=30s;

# Upstream API server
upstream api_backend {
    server backend:3001;
    keepalive 32;
}




# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name trailershub.org www.trailershub.org;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://trailershub.org$request_uri;
    }
}

# Redirect the duplicate HTTPS hostname to the canonical hostname.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.trailershub.org;

    ssl_certificate /etc/letsencrypt/live/trailershub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trailershub.org/privkey.pem;

    return 301 https://trailershub.org$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trailershub.org;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/trailershub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trailershub.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Helmet also emits these headers from the upstream application. Hide the
    # upstream copies so clients receive one authoritative value from Nginx.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Edge security headers. Framing is controlled by Helmet's frame-ancestors
    # CSP directive; that does not prevent this site from embedding YouTube.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Root directory for frontend (Disabling to proxy to Docker container instead)
    # root /var/www/movietrailers;
    # index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Billing verification has a small body cap and a dedicated edge limit.
    # X-Forwarded-For is overwritten so direct clients cannot forge limiter keys.
    location = /api/dead-city/google-play-purchases/verify {
        limit_req zone=dead_city_billing burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 128k;

        set $api_upstream http://api_backend;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30;
    }

    location @dead_city_billing_rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"message":"Too many verification attempts. Please retry later."}';
    }

    error_page 429 = @dead_city_billing_rate_limited;

    # API proxy - proxy /api/* to backend
    location ^~ /api {
        limit_req zone=api burst=20 nodelay;
        
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }



    # Google OAuth routes - must be before SPA fallback
    location /auth/google {
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream/auth/google;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /auth/google/callback {
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream/auth/google/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }



    # File upload endpoint - exact match to ensure it's caught before SPA fallback
    # Updated to point to /api/upload
    location = /api/upload {
        limit_req zone=api burst=20 nodelay;
        
        client_max_body_size 10M;
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream/api/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90;
        proxy_request_buffering off;
    }

    # Favicon upload endpoint
    location = /api/upload/favicon {
        limit_req zone=api burst=20 nodelay;
        
        client_max_body_size 10M;
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream/api/upload/favicon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120;
        proxy_request_buffering off;
    }

    # Public favicon settings endpoint (no auth required)
    location = /api/settings/favicon {
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream/api/settings/favicon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30;
    }


    
    # Removed specific /comments, /categories, /movies locations as they are handled by /api/ now, or should fall through to SPA
    
    # TMDB/Health legacy routes that might not use /api yet (if any)
    location ~ ^/(tmdb|health)(/|$) {
        limit_req zone=api burst=20 nodelay;
        
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90;
    }



    # Uploaded files handling
    location /uploads/ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Ensure correct content types for images when matching as prefix
        location ~* \.(jpeg|jpg)$ {
            add_header Content-Type "image/jpeg" always;
        }
        location ~* \.png$ {
            add_header Content-Type "image/png" always;
        }
        location ~* \.gif$ {
            add_header Content-Type "image/gif" always;
        }
        location ~* \.webp$ {
            add_header Content-Type "image/webp" always;
        }
    }



    # SPA Fallback - Proxy to backend which handles static files and SPA routing
    location / {
        limit_req zone=api burst=20 nodelay;
        set $api_upstream http://api_backend;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
