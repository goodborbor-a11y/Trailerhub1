# ===========================================
# Docker Compose for Movie Trailers App
# ===========================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: movietrailers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: movietrailers-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:3001}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEAD_CITY_UNITY_PROJECT_ID: ${DEAD_CITY_UNITY_PROJECT_ID:?DEAD_CITY_UNITY_PROJECT_ID is required}
      DEAD_CITY_UNITY_ENVIRONMENT_ID: ${DEAD_CITY_UGS_ENVIRONMENT_ID:?DEAD_CITY_UGS_ENVIRONMENT_ID is required}
      DEAD_CITY_UNITY_ENVIRONMENT_NAME: ${DEAD_CITY_UNITY_ENVIRONMENT_NAME:?DEAD_CITY_UNITY_ENVIRONMENT_NAME is required}
      DEAD_CITY_GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-play-verifier.json
      DEAD_CITY_UGS_PROJECT_ID: ${DEAD_CITY_UGS_PROJECT_ID:?DEAD_CITY_UGS_PROJECT_ID is required}
      DEAD_CITY_UGS_ENVIRONMENT_ID: ${DEAD_CITY_UGS_ENVIRONMENT_ID:?DEAD_CITY_UGS_ENVIRONMENT_ID is required}
      DEAD_CITY_UGS_KEY_ID: ${DEAD_CITY_UGS_KEY_ID:?DEAD_CITY_UGS_KEY_ID is required}
      DEAD_CITY_UGS_SECRET_KEY: ${DEAD_CITY_UGS_SECRET_KEY:?DEAD_CITY_UGS_SECRET_KEY is required}
      DEAD_CITY_GOOGLE_CLIENT_ID: ${DEAD_CITY_GOOGLE_CLIENT_ID:?DEAD_CITY_GOOGLE_CLIENT_ID is required}
      DEAD_CITY_UNITY_GOOGLE_PROVIDER_IDS: ${DEAD_CITY_UNITY_GOOGLE_PROVIDER_IDS:?DEAD_CITY_UNITY_GOOGLE_PROVIDER_IDS is required}
      DEAD_CITY_DELETION_PEPPER: ${DEAD_CITY_DELETION_PEPPER:?DEAD_CITY_DELETION_PEPPER is required}
      DEAD_CITY_SMTP_HOST: ${DEAD_CITY_SMTP_HOST:?DEAD_CITY_SMTP_HOST is required}
      DEAD_CITY_SMTP_PORT: ${DEAD_CITY_SMTP_PORT:?DEAD_CITY_SMTP_PORT is required}
      DEAD_CITY_SMTP_SECURE: ${DEAD_CITY_SMTP_SECURE:?DEAD_CITY_SMTP_SECURE is required}
      DEAD_CITY_SMTP_USER: ${DEAD_CITY_SMTP_USER:?DEAD_CITY_SMTP_USER is required}
      DEAD_CITY_SMTP_PASSWORD: ${DEAD_CITY_SMTP_PASSWORD:?DEAD_CITY_SMTP_PASSWORD is required}
      DEAD_CITY_EMAIL_FROM: ${DEAD_CITY_EMAIL_FROM:?DEAD_CITY_EMAIL_FROM is required}
    volumes:
      - /var/www/uploads:/var/www/uploads
      - ./server/data:/app/server/data
      - /root/.config/dead-city/google-play-verifier.json:/run/secrets/google-play-verifier.json:ro
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  # Adminer Database GUI
  adminer:
    image: adminer
    container_name: movietrailers-adminer
    profiles: ["tools"]
    restart: "no"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: movietrailers-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/movietrailers.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/var/www/html
      - /var/www/uploads:/var/www/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  default:
    name: movietrailers-final
    external: true
