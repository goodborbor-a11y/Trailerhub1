name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: trailerhub-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build backend and run SEO tests
        run: |
          npm ci --prefix server
          npm --prefix server run test:seo

  deploy:
    name: Deploy to production
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run restricted production deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: /usr/local/sbin/trailerhub-deploy
